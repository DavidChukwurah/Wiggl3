[package]
name = "wiggl3"
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
description = "Tiny cross-platform tool that nudges the mouse so chat apps don't flip to Away."
license = "MIT"
publish = false

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
notify-rust = { version = "4", default-features = false, features = ["z"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_SystemInformation",
    "Win32_System_Power",
    "Win32_System_Registry",
] }

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }
x11rb = { version = "0.14", default-features = false, features = ["xtest", "screensaver"] }
ashpd = { version = "0.13", default-features = false, features = ["async-io", "remote_desktop", "screencast", "inhibit"] }
pollster = "0.4"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
