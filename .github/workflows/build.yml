# Builds wiggl3 for Windows, macOS and Linux, runs the tests on each, and publishes the finished files on the
# repository's Releases page under fixed names, so the download links never change:
#   wiggl3-windows-x64.exe   wiggl3-mac-universal.dmg   wiggl3-linux-x86_64.tar.gz   wiggl3-linux-aarch64.tar.gz
# Every push to main refreshes the "latest" release. Push a tag like v0.3.0 for a numbered release.
# You can also start it by hand: Actions tab > build > Run workflow.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # One pinned compiler for every system, so a new Rust release can never break a build overnight.
  RUST_VERSION: "1.98.1"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update && rustup default "$RUST_VERSION"
      - name: Test
        working-directory: source
        run: cargo test --locked
      - name: Build
        working-directory: source
        run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp source/target/release/wiggl3.exe dist/wiggl3-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: wiggl3-windows
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default "$RUST_VERSION"
      - name: Test
        working-directory: source
        run: cargo test --locked
      - name: Build (Apple silicon and Intel)
        working-directory: source
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Package (one universal app inside a .dmg)
        run: |
          mkdir -p dist stage
          lipo -create source/target/aarch64-apple-darwin/release/wiggl3 source/target/x86_64-apple-darwin/release/wiggl3 -output stage/wiggl3-universal
          lipo -info stage/wiggl3-universal
          bash source/tools/make_mac_app.sh stage/wiggl3-universal stage/wiggl3.app
          rm stage/wiggl3-universal
          ln -s /Applications stage/Applications
          hdiutil create -volname wiggl3 -srcfolder stage -ov -format UDZO dist/wiggl3-mac-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: wiggl3-mac
          path: dist/*

  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build inside an old-glibc container (runs on Debian 10+, Ubuntu 18.10+, Fedora, RHEL 8+, Arch ...)
        run: |
          docker run --rm -e RUST_VERSION -v "$PWD":/src quay.io/pypa/manylinux_2_28_x86_64 bash /src/source/tools/ci_linux.sh x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: wiggl3-linux-x86_64
          path: dist/*

  linux-aarch64:
    # ARM computers (Raspberry Pi, ARM laptops and servers). If this one ever fails, the other systems still publish.
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build inside an old-glibc container
        run: |
          docker run --rm -e RUST_VERSION -v "$PWD":/src quay.io/pypa/manylinux_2_28_aarch64 bash /src/source/tools/ci_linux.sh aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: wiggl3-linux-aarch64
          path: dist/*

  release:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [windows, macos, linux-x86_64, linux-aarch64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          cat > notes.md <<'NOTES'
          Download the file for your computer (see the README for the one-minute install steps):

          - **Windows:** wiggl3-windows-x64.exe
          - **Mac (Apple silicon and Intel):** wiggl3-mac-universal.dmg
          - **Linux (Intel/AMD):** wiggl3-linux-x86_64.tar.gz
          - **Linux (ARM):** wiggl3-linux-aarch64.tar.gz

          These files are not signed with a paid certificate, so Windows and macOS show a one-time warning on first
          open. The README explains what to click. SHA256SUMS.txt lets you verify your download.
          NOTES
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$REF_NAME" dist/* --repo "$REPO" --title "wiggl3 $REF_NAME" --notes-file notes.md
          else
            gh release delete latest --repo "$REPO" --cleanup-tag --yes || true
            gh release create latest dist/* --repo "$REPO" --target "$SHA" --title "wiggl3 (latest build)" --notes-file notes.md
          fi
